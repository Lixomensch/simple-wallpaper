name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../swp-${{ matrix.target }}.tar.gz swp

      - name: Build .deb package
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Move .deb to workspace root
        run: |
          cp target/${{ matrix.target }}/debian/*.deb ./swp_${{ matrix.deb_arch }}.deb

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: swp-${{ matrix.target }}-tar
          path: swp-${{ matrix.target }}.tar.gz

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: swp-${{ matrix.deb_arch }}-deb
          path: swp_${{ matrix.deb_arch }}.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > artifacts/PKGBUILD << 'PKGBUILD_EOF'
          # Maintainer: João Pedro Lemes Queiroz
          pkgname=simple-wallpaper
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="A minimal CLI wallpaper manager for Linux"
          arch=('x86_64' 'aarch64')
          url="https://github.com/Lixomensch/simple-wallpaper"
          license=('Apache-2.0')
          options=('!debug')
          depends=()
          makedepends=('cargo')
          optdepends=(
              'swww: Hyprland / generic Wayland backend'
              'swaybg: Sway backend'
              'feh: X11 backend'
          )
          source=("$pkgname-$pkgver.tar.gz::$url/archive/v$pkgver.tar.gz")
          sha256sums=('SKIP')

          prepare() {
              cd "$pkgname-$pkgver"
              export RUSTUP_TOOLCHAIN=stable
              cargo fetch --locked --target "$(rustc -vV | sed -n 's/host: //p')"
          }

          build() {
              cd "$pkgname-$pkgver"
              export RUSTUP_TOOLCHAIN=stable
              export CARGO_TARGET_DIR=target
              cargo build --frozen --release
          }

          package() {
              cd "$pkgname-$pkgver"
              strip "target/release/swp"
              install -Dm755 "target/release/swp" "$pkgdir/usr/bin/swp"
              install -Dm644 "LICENSE" "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
              install -Dm644 "README.md" "$pkgdir/usr/share/doc/$pkgname/README.md"
              install -Dm644 "systemd/swp-resume.service" "$pkgdir/usr/share/doc/$pkgname/swp-resume.service"
          }
          PKGBUILD_EOF
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/" artifacts/PKGBUILD
          sed -i 's/^          //' artifacts/PKGBUILD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/PKGBUILD
